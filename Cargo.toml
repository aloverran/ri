[workspace]
members = [
    "crates/ri",
    "crates/ri-ai",
    "crates/ri-kit",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
eyre = "0.6"
thiserror = "2"
tracing = "0.1"
sha2 = "0.10"
rand = "0.9"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
os_info = { version = "3", default-features = false }
dirs = "6"
tokio-stream = "0.1"
bytes = "1"
tokio-util = { version = "0.7", features = ["rt"] }
urlencoding = "2"
async-trait = "0.1"
command-group = { version = "5", features = ["with-tokio"] }
async-stream = "0.3"
fs4 = "0.13"
ri = { path = "crates/ri" }
ri-ai = { path = "crates/ri-ai" }
ri-kit = { path = "crates/ri-kit" }

